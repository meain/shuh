<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>shuh</title>
  </head>
  <body>
    <header>
      <h1>shuh</h1>
      <p class="hint">Read this page out loud.</p>
    </header>

    <button id="start" class="primary">Start reading</button>

    <section>
      <label for="voice">Voice</label>
      <select id="voice"></select>
    </section>

    <section>
      <label for="speed">Speed <span id="speed-val">1.0×</span></label>
      <input id="speed" type="range" min="0.5" max="4" step="0.5" value="1" />
    </section>

    <section id="model-status" hidden>
      <label>Loading model…</label>
      <progress id="model-progress" max="100" value="0"></progress>
      <p class="hint" id="model-detail"></p>
    </section>

    <footer>
      <p class="hint">Piper runs on-device. First use of a voice downloads ~25–60&nbsp;MB.</p>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
